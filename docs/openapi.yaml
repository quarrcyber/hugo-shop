openapi: 3.1.0
info:
  title: Hugo Shop API
  version: 1.0.0
  description: REST API cho môi trường thương mại điện tử local. Không dùng dữ liệu thật.
servers:
  - url: http://127.0.0.1:8080/api/v1
paths:
  /products:
    get:
      summary: Danh sách sản phẩm
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string } }
        - { name: min_price, in: query, schema: { type: integer, minimum: 0 } }
        - { name: max_price, in: query, schema: { type: integer, minimum: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, rating] } }
      responses:
        '200':
          description: Trang sản phẩm
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Product' } }
  /products/{slug}:
    get:
      summary: Chi tiết sản phẩm
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Sản phẩm
          content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/register:
    post:
      summary: Đăng ký
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, pattern: '^0[0-9]{9}$' }
                password: { type: string, format: password, minLength: 10 }
                password_confirmation: { type: string, format: password }
      responses:
        '201': { description: Token và người dùng }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Sanctum bearer token }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout:
    post:
      summary: Thu hồi token hiện tại
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Đã đăng xuất }
  /cart/items/{product}:
    post:
      summary: Thêm sản phẩm vào giỏ
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [quantity], properties: { quantity: { type: integer, minimum: 1, maximum: 20 } } } } }
      responses:
        '200': { description: Giỏ hàng }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      summary: Cập nhật số lượng
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [quantity], properties: { quantity: { type: integer, minimum: 0, maximum: 20 } } } } }
      responses:
        '200': { description: Giỏ hàng }
  /orders:
    get:
      summary: Đơn hàng của người dùng hiện tại
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sách đơn }
    post:
      summary: Checkout và tạo đơn
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Checkout' }
      responses:
        '201': { description: Đơn hàng đã tạo }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{order}:
    get:
      summary: Chi tiết đơn thuộc người dùng hiện tại
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: order, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Đơn hàng }
        '403': { $ref: '#/components/responses/Forbidden' }
  /products/{product}/reviews:
    post:
      summary: Gửi đánh giá cho sản phẩm đã mua
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, content]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                content: { type: string, minLength: 10, maxLength: 1500 }
      responses:
        '201': { description: Đánh giá chờ duyệt }
        '422': { $ref: '#/components/responses/ValidationError' }
  /account:
    get:
      summary: Hồ sơ, địa chỉ và thẻ token hóa của người dùng hiện tại
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Hồ sơ tài khoản; card_token luôn bị ẩn }
    patch:
      summary: Cập nhật tên và số điện thoại
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                phone: { type: [string, 'null'], pattern: '^0[0-9]{9}$' }
      responses:
        '200': { description: Hồ sơ đã cập nhật }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/overview:
    get:
      summary: Chỉ số vận hành dành cho Staff và Admin
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Đơn cần xử lý, tồn kho thấp và review chờ duyệt }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users:
    get:
      summary: Danh sách người dùng, chỉ dành cho Admin
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Danh sách người dùng phân trang }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{user}:
    patch:
      summary: Cập nhật vai trò và trạng thái người dùng, chỉ dành cho Admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, status]
              properties:
                role: { type: string, enum: [customer, staff, admin] }
                status: { type: string, enum: [active, suspended] }
      responses:
        '200': { description: Người dùng đã cập nhật }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    Product:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        price: { type: integer, description: Số nguyên VND }
        stock: { type: integer }
        image_url: { type: [string, 'null'] }
        rating: { type: number }
        reviews_count: { type: integer }
    Checkout:
      type: object
      required: [recipient_name, phone, line1, ward, district, city, payment_method]
      properties:
        recipient_name: { type: string }
        phone: { type: string, pattern: '^0[0-9]{9}$' }
        line1: { type: string }
        ward: { type: string }
        district: { type: string }
        city: { type: string }
        payment_method: { type: string, enum: [card, cod] }
        credit_card_id: { type: integer }
        card_number: { type: string, description: Chỉ gửi thẻ test; không được lưu tại Shop }
        expiration: { type: string, pattern: '^(0[1-9]|1[0-2])/[0-9]{2}$' }
        cvv: { type: string, description: Chỉ gửi thẻ test; không được lưu tại Shop }
        save_card: { type: boolean }
        notes: { type: string, maxLength: 500 }
  responses:
    ValidationError:
      description: Dữ liệu không hợp lệ
    Forbidden:
      description: Không có quyền truy cập
    NotFound:
      description: Không tìm thấy tài nguyên
