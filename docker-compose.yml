name: hugo-shop

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      shop-php-fpm:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - dmz
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  shop-php-fpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hugo_shop}
      DB_USERNAME: ${DB_USERNAME:-hugo}
      DB_PASSWORD: ${DB_PASSWORD:-hugo_local_password}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_password}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio_local_password}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: products
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      PAYMENT_SERVICE_URL: http://payment-svc:8081
      PAYMENT_SERVICE_KEY: ${PAYMENT_SERVICE_KEY:-local-payment-service-key}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-webhook-signing-secret}
      SHIPPING_SERVICE_URL: http://mock-shipping:8082
      SHIPPING_SERVICE_KEY: ${SHIPPING_SERVICE_KEY:-local-shipping-service-key}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      payment-svc:
        condition: service_healthy
      mock-shipping:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 8

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3", "--timeout=60"]
    env_file: .env
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-hugo_shop}
      DB_USERNAME: ${DB_USERNAME:-hugo}
      DB_PASSWORD: ${DB_PASSWORD:-hugo_local_password}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_password}
      QUEUE_CONNECTION: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    depends_on:
      shop-php-fpm:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "default", "--max=100"]
      interval: 15s
      timeout: 5s
      retries: 5

  payment-svc:
    build:
      context: services/payment
    environment:
      SERVICE_KEY: ${PAYMENT_SERVICE_KEY:-local-payment-service-key}
      WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-local-webhook-signing-secret}
      SHOP_WEBHOOK_URL: http://nginx/api/v1/payments/webhook
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  mock-shipping:
    build:
      context: services/mock-shipping
    environment:
      SERVICE_KEY: ${SHIPPING_SERVICE_KEY:-local-shipping-service-key}
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hugo_shop}
      MYSQL_USER: ${DB_USERNAME:-hugo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hugo_local_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_password}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root_local_password}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_local_password}"]
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_local_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 8

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_local_password}
    volumes:
      - minio-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 8

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/products
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_local_password}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - data

  mailpit:
    image: axllent/mailpit:v1.27
    networks:
      - app
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  dmz: {}
  app:
    internal: true
  data:
    internal: true

volumes:
  mysql-data: {}
  minio-data: {}
